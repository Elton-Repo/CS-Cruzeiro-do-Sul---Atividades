<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BootStrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" >
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container-fruid p-0"> 
        <section class="grupo-botoes">
            <h6>Botões com o uso BootStrap</h6>
            <button class = "btn btn-primary btn-sm" type="button">
                primeiro
            </button>
            <button class="btn btn-secondary btn-sm" type="button">
                Segundo
            </button>
            <button class="btn btn-success btn-sm" type="button">
                Sucesso
            </button>
            <button class="btn btn-danger btn-sm" type="button">
                Perigo
            </button>
            <button class="btn btn-warning btn-sm" type="button">
                Aviso
            </button>
            <button class="btn btn-info btn-sm" type="button">
                Informação
            </button>
            <button class="btn btn-light" type="button">
                Claro
            </button>
            <button class="btn btn-dark" type="button">
                Escuro
            </button>
        </section>
        <section class="grupo de botões">
        <h6>Botões sem BootStrap</h6>
        <button class="botão personalizado" type="button">
            Meu botão sem BootStrap secundario
        </button>
        <button class="botão-personalizado" type="button">
            Meu botão sem BootStrap terceario
        </button>
        <button class="botão-personalizado" type="button">
            Meu botão sem BootStrap quartenario
        </button>
        </section>
        <p id="mensagem" role="status"></p>
    </main>
    <script type="text/javascript" src="script.js"></script>
</body>
</html>
